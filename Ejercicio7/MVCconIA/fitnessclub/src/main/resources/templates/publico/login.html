<!DOCTYPE html>
<html class="no-js" lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/* Inicio de sesión. Usa el layout público (hero interior de la plantilla). El formulario hace POST a /login,
       que procesa Spring Security. th:action agrega automáticamente el token CSRF como campo oculto.
       Spring Security redirige acá con ?error (credenciales inválidas) o ?logout (sesión cerrada). */-->
<head th:replace="~{fragments/publico :: pageHead('Ingresar')}"></head>
<body>
<div th:replace="~{fragments/publico :: precarga}"></div>
<header th:replace="~{fragments/publico :: cabecera}"></header>
<main>
    <div class="slider-area2">
        <div class="slider-height2 d-flex align-items-center">
            <div class="container">
                <div class="row"><div class="col-xl-12">
                    <div class="hero-cap hero-cap2 pt-70 text-center"><h2>Ingreso del personal</h2></div>
                </div></div>
            </div>
        </div>
    </div>

    <section class="contact-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-8">
                    <div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
                    <div class="alert alert-success" th:if="${param.logout}">Cerró sesión correctamente.</div>

                    <form class="form-contact" th:action="@{/login}" method="post">
                        <div class="form-group">
                            <input class="form-control" type="text" name="username" placeholder="Usuario" autocomplete="username" autofocus required>
                        </div>
                        <div class="form-group">
                            <input class="form-control" type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
                        </div>
                        <div class="form-group mt-3 text-center">
                            <button type="submit" class="button button-contactForm boxed-btn">Ingresar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/publico :: pie}"></footer>
<div th:replace="~{fragments/publico :: subir}"></div>
<th:block th:replace="~{fragments/publico :: scripts}"></th:block>
</body>
</html>
