<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/* Página del panel: usa los fragmentos de fragments/admin.html (cabecera, barra, menú, pie, scripts). */-->
<head th:replace="~{fragments/admin :: pageHead('Usuario')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{fragments/admin :: barraSuperior}"></nav>
<div id="layoutSidenav">
    <div th:replace="~{fragments/admin :: menuLateral('usuarios')}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">Datos del usuario</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/panel}">Panel</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/usuarios}">Usuarios</a></li>
                    <li class="breadcrumb-item active">Datos del usuario</li>
                </ol>
                <div th:replace="~{fragments/admin :: alertas}"></div>
                <div class="card mb-4">
                    <div class="card-body">
                        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" autocomplete="off" novalidate>
                            <input type="hidden" th:field="*{id}">
                            <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="username">Usuario *</label>
                                <input class="form-control" type="text" th:field="*{username}" th:errorclass="is-invalid" maxlength="60" autofocus>
                                <div class="invalid-feedback" th:errors="*{username}">Error</div>
                            </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="rol">Rol *</label>
                                    <select class="form-select" th:field="*{rol}" th:errorclass="is-invalid">
                                        <option value="">Seleccionar...</option>
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.etiqueta}">Rol</option>
                                    </select>
                                    <div class="invalid-feedback" th:errors="*{rol}">Error</div>
                                </div>
                            <div class="col-md-6">
                                <label class="form-label" for="password">Contraseña</label>
                                <input class="form-control" type="password" th:field="*{password}" th:errorclass="is-invalid" maxlength="72" autocomplete="new-password">
                                <div class="invalid-feedback" th:errors="*{password}">Error</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="confirmarPassword">Confirmar contraseña</label>
                                <input class="form-control" type="password" th:field="*{confirmarPassword}" th:errorclass="is-invalid" maxlength="72" autocomplete="new-password">
                                <div class="invalid-feedback" th:errors="*{confirmarPassword}">Error</div>
                            </div>
                                <div class="col-12 form-text">
                                    <span th:if="${usuario.id == 0}">La contraseña es obligatoria (mínimo 8 caracteres).</span>
                                    <span th:if="${usuario.id != 0}">Dejela vacía para conservar la contraseña actual.</span>
                                </div>
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary"><i class="fas fa-floppy-disk"></i> Guardar</button>
                                <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
        <footer th:replace="~{fragments/admin :: pie}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
