<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/* Página del panel: usa los fragmentos de fragments/admin.html (cabecera, barra, menú, pie, scripts). */-->
<head th:replace="~{fragments/admin :: pageHead('Cuotas')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{fragments/admin :: barraSuperior}"></nav>
<div id="layoutSidenav">
    <div th:replace="~{fragments/admin :: menuLateral('cuotas')}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">Cuotas</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/panel}">Panel</a></li>
                    
                    <li class="breadcrumb-item active">Cuotas</li>
                </ol>
                <div th:replace="~{fragments/admin :: alertas}"></div>
                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-file-invoice-dollar me-1"></i> Cuotas emitidas</span>
                        <span>
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/cuotas/generar}"><i class="fas fa-layer-group"></i> Generar cuotas del mes</a>
                            <a class="btn btn-primary btn-sm" th:href="@{/cuotas/nueva}"><i class="fas fa-plus"></i> Nueva cuota</a>
                        </span>
                    </div>
                    <div class="card-body">
                        <table class="tabla-datos table table-hover align-middle">
                            <thead><tr><th>Período</th><th>Familia</th><th>Vence</th><th>Importe</th><th>Saldo</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
                            <tbody>
                                <tr th:each="c : ${cuotas}">
                                    <td th:text="${c.periodoTexto}">Período</td>
                                    <td th:text="${c.grupoFamiliarNombre}">Familia</td>
                                    <td th:text="${#temporals.format(c.fechaVencimiento, 'dd/MM/yyyy')}">-</td>
                                    <td>$ <span th:text="${#numbers.formatDecimal(c.importe, 1, 'POINT', 2, 'COMMA')}">0</span></td>
                                    <td>$ <span th:text="${#numbers.formatDecimal(c.saldo, 1, 'POINT', 2, 'COMMA')}">0</span></td>
                                    <td><span class="badge" th:text="${c.vencida} ? 'Vencida' : ${c.estado.etiqueta}"
                                              th:classappend="${c.estado.name() == 'PAGADA'} ? 'bg-success' : (${c.estado.name() == 'ANULADA'} ? 'bg-secondary' : (${c.vencida} ? 'bg-danger' : 'bg-warning text-dark'))">Estado</span></td>
                                    <td class="text-end text-nowrap">
                                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/cuotas/{id}(id=${c.id})}" title="Detalle y pagos"><i class="fas fa-eye"></i></a>
                                        <a class="btn btn-sm btn-outline-primary" th:if="${c.estado.name() != 'ANULADA'}" th:href="@{/cuotas/{id}/editar(id=${c.id})}" title="Editar"><i class="fas fa-pen"></i></a>
                                        <form class="d-inline" method="post" th:if="${c.estado.name() != 'ANULADA'}" th:action="@{/cuotas/{id}/anular(id=${c.id})}"
                                              onsubmit="return confirm('¿Anular esta cuota?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Anular"><i class="fas fa-ban"></i></button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
        <footer th:replace="~{fragments/admin :: pie}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/admin :: scripts}"></th:block>
</body>
</html>
