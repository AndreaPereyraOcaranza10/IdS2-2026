# =====================================================================
#  CONFIGURACIÓN DE LA APLICACIÓN - Club deportivo (fitnessclub)
# =====================================================================
spring.application.name=fitnessclub
server.port=8080

# ---------- Base de datos MySQL (XAMPP local) ----------
# createDatabaseIfNotExist=true crea el esquema "fitnessclub" si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/fitnessclub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Mendoza
spring.datasource.username=root
spring.datasource.password=

# ---------- JPA / Hibernate (ORM) ----------
# update: Hibernate crea/ajusta las tablas a partir de las entidades (solo para desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# OSIV desactivado: las entidades LAZY NO llegan a la vista. Refuerza la regla
# "la vista solo ve DTOs": todo el mapeo entidad->DTO ocurre dentro del @Transactional del servicio.
spring.jpa.open-in-view=false

# ---------- Subida de imágenes (foto de rostro) ----------
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# ---------- Internacionalización ----------
# Locale fijo es_AR: formato de números/fechas y textos de validación en español.
spring.web.locale=es_AR
spring.web.locale-resolver=fixed

# ---------- Datos de demostración (ver config/InicializadorDatos) ----------
# Cantidad de familias de demo a crear si la base está vacía (0 = no crear datos demo).
# Para pruebas de carga se puede ejecutar con:  --club.datos-demo.cantidad-familias=200
club.datos-demo.cantidad-familias=5

# ---------- Cuota: importe sugerido en los formularios ----------
club.cuota.importe-sugerido=25000.00
