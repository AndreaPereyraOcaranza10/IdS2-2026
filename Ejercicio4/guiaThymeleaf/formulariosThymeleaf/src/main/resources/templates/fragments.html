<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Header</title>
</head>
<body>

    <header th:fragment="header" style="
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 25px;
        ">
        <div style="display: flex; align-items: center; gap: 12px;">
                <span style="
                    font-family: inherit;
                    background-color: #4f46e5;
                    color: #ffffff;
                    padding: 6px 12px;
                    border-radius: 6px;
                    font-weight: 700;
                    font-size: 14px;
                    letter-spacing: 0.5px;
                ">Ingenieria de Software 2</span>
            <span style="font-size: 17px; font-weight: 600; color: #1f2937;">Administrador de Productos 1.0</span>
        </div>

        <nav style="display: flex; gap: 10px;">
            <a th:href="@{/}" style="
                    font-family: inherit;
                    text-decoration: none;
                    color: #4b5563;
                    padding: 8px 14px;
                    font-size: 14px;
                    font-weight: 500;
                    border-radius: 6px;
                    transition: all 0.2s;
                ">Inicio</a>

            <a th:href="@{/productos}" style="
                    font-family: inherit;
                    text-decoration: none;
                    background-color: #e0e7ff;
                    color: #4338ca;
                    padding: 8px 14px;
                    font-size: 14px;
                    font-weight: 600;
                    border-radius: 6px;
                    transition: all 0.2s;
                ">Ver Productos</a>
        </nav>
    </header>

    <div th:fragment="alertaInformativa" style="
        background-color: #eef2ff;
        border-left: 4px solid #4f46e5;
        border-radius: 6px;
        padding: 12px 16px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #3730a3;
        font-size: 14px;
        ">
        <span style="font-weight: 600;">Nota:</span>
        <span>Los datos mostrados corresponden a la sesión actual del sistema.</span>
    </div>

    <footer th:fragment="footer" style="
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #ffffff;
        border-top: 1px solid #e5e7eb;
        padding: 20px;
        text-align: center;
        color: #6b7280;
        font-size: 13px;
        margin-top: 35px;
    ">
        <p>© 2026 <strong>Ingenieria de Software 2</strong> - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
