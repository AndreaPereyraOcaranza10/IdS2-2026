<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--/*
  ============================================================================
  VISTA: inicio.html  -  Pantalla de bienvenida  (GET /inicio)
  ============================================================================
  Solo se llega con sesión iniciada (lo verifica ControladorAutenticacion).
  Modelo:
    usuario (UsuarioSesionDTO)  nombre, apellido y correo del usuario logueado.
*/-->
<head th:replace="~{fragments/layout :: pageHead('Inicio')}"></head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/layout :: encabezado}"></div>

<main class="auth-fondo flex-grow-1 py-5">
  <div class="container">
    <div class="row">
      <div class="col-md-8 col-lg-6 mx-auto">
        <div class="auth-card text-center">
          <h1 class="h2 mb-3">¡Bienvenido/a!</h1>
          <!--/* th:text escapa el contenido (evita inyección de HTML). */-->
          <p class="fs-4 mb-1" th:text="${usuario.nombre} + ' ' + ${usuario.apellido}">Nombre Apellido</p>
          <p class="text-muted" th:text="${usuario.correo}">correo@ejemplo.com</p>
          <div class="alert alert-success mt-4 mb-0" role="alert">Ingresó correctamente al sistema.</div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/layout :: pie}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
