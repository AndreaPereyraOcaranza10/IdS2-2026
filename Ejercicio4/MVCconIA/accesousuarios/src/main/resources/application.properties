# =============================================================================
# application.properties - Configuración de Spring Boot
# =============================================================================
# Spring Boot lee este archivo al arrancar y autoconfigura el DataSource, JPA,
# Thymeleaf y el servidor web a partir de estas propiedades.

spring.application.name=accesousuarios

# ---- Servidor web (Tomcat embebido) ----------------------------------------
server.port=8080

# ---- Base de datos MySQL (XAMPP) -------------------------------------------
# createDatabaseIfNotExist=true: el driver crea el esquema "acceso_usuarios" si
# no existe, así no hay que crearlo a mano. Usuario/clave por defecto de XAMPP.
spring.datasource.url=jdbc:mysql://localhost:3306/acceso_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ---- JPA / Hibernate (ORM) --------------------------------------------------
# ddl-auto=update: Hibernate crea/ajusta las tablas (personas, usuarios) segun
# las entidades. Util en desarrollo; en producción se usarian migraciones.
spring.jpa.hibernate.ddl-auto=update
# Muestra el SQL generado en consola (sirve para ver el trabajo del ORM).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# open-in-view=false: la sesión de Hibernate NO queda abierta durante el render de
# la vista. Fuerza a que los datos se lean dentro de la capa de servicio y a que
# la vista solo reciba DTOs (nunca entidades).
spring.jpa.open-in-view=false

# ---- Idioma -----------------------------------------------------------------
# Mensajes de validación y formatos en espanol.
spring.web.locale=es_AR
spring.web.locale-resolver=fixed
