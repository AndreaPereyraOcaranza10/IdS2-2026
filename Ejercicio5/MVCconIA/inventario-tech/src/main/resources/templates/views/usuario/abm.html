<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: pageHead('Usuarios')}"></head>
<body>
<div id="overlay" class="overlay"></div>
<nav th:replace="~{components/layout :: topbar}"></nav>
<aside th:replace="~{components/layout :: sidebar('usuarios')}"></aside>

<main id="content" class="content py-10">
    <div class="container-fluid">

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="fs-3 mb-1">Usuarios</h1>
                        <p class="mb-0">Personas que operan el sistema</p>
                    </div>
                    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Agregar Usuario</a>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <table class="table mb-0 text-nowrap table-hover">
                    <thead class="table-light border-light">
                    <tr>
                        <th>Usuario</th>
                        <th>Nombre</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Accion</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario : ${usuarios}" class="align-middle">
                        <td th:text="${usuario.username}">usuario</td>
                        <td th:text="${usuario.nombre}">Nombre</td>
                        <td th:text="${usuario.rol}">ADMIN</td>
                        <td>
                            <span class="badge" th:classappend="${usuario.activo} ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'"
                                  th:text="${usuario.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                        </td>
                        <td>
                            <a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}"><i class="ti ti-edit"></i></a>
                            <form th:action="@{/usuarios/{id}/eliminar(id=${usuario.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar este usuario?');">
                                <button type="submit" class="btn btn-link link-danger p-0 ms-2">
                                    <i class="ti ti-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="5" class="text-center text-secondary py-4">No hay usuarios cargados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <footer th:replace="~{components/layout :: footer}"></footer>
            </div>
        </div>
    </div>
</main>
</body>
</html>
