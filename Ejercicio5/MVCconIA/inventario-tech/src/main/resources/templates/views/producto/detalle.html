<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: pageHead('Detalle de Producto')}"></head>
<body>
<div id="overlay" class="overlay"></div>
<nav th:replace="~{components/layout :: topbar}"></nav>
<aside th:replace="~{components/layout :: sidebar('productos')}"></aside>

<main id="content" class="content py-10">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="fs-3 mb-1" th:text="${producto.nombre}">Producto</h1>
                    <div class="d-flex gap-2">
                        <a th:href="@{/productos/{id}/editar(id=${producto.id})}" class="btn btn-primary">Editar</a>
                        <a th:href="@{/productos}" class="btn btn-outline-secondary">Volver</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body p-4">
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <p class="mb-1 text-secondary small">Codigo (SKU)</p>
                                <p class="fw-semibold" th:text="${producto.codigo}">-</p>
                            </div>
                            <div class="col-md-4">
                                <p class="mb-1 text-secondary small">Categoria</p>
                                <p class="fw-semibold" th:text="${producto.categoria}">-</p>
                            </div>
                            <div class="col-md-4">
                                <p class="mb-1 text-secondary small">Estado</p>
                                <span class="badge" th:classappend="${producto.activo} ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'"
                                      th:text="${producto.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <p class="mb-1 text-secondary small">Precio de Compra</p>
                                <p class="fw-semibold" th:text="${'$' + producto.precioCompra}">-</p>
                            </div>
                            <div class="col-md-4">
                                <p class="mb-1 text-secondary small">Precio de Venta</p>
                                <p class="fw-semibold" th:text="${'$' + producto.precioVenta}">-</p>
                            </div>
                            <div class="col-md-4">
                                <p class="mb-1 text-secondary small">Stock Actual / Minimo</p>
                                <p class="fw-semibold">
                                    <span th:text="${producto.stockActual}" th:classappend="${producto.bajoStockMinimo} ? 'text-danger'">0</span>
                                    / <span th:text="${producto.stockMinimo}">0</span>
                                </p>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-12">
                                <p class="mb-1 text-secondary small">Descripcion</p>
                                <p th:text="${producto.descripcion}">-</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <footer th:replace="~{components/layout :: footer}"></footer>
            </div>
        </div>
    </div>
</main>
</body>
</html>
