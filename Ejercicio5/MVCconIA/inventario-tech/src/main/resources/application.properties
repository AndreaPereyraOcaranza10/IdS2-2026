spring.application.name=inventario-tech

# Conexion MySQL via XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_tech?useSSL=false&serverTimezone=America/Argentina/Mendoza&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Datos de prueba (data.sql): por defecto Spring Boot solo corre data.sql automaticamente
# en bases embebidas (H2, etc). Como usamos MySQL real, hay que habilitarlo a mano.
# defer-datasource-initialization=true asegura que Hibernate cree las tablas PRIMERO
# y data.sql se ejecute DESPUES (si no, fallaria porque las tablas todavia no existen).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Thymeleaf (desactivar cache en dev)
spring.thymeleaf.cache=false

server.port=8080
