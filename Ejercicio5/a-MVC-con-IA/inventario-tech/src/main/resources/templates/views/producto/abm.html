<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: pageHead('Productos')}"></head>
<body>
<div id="overlay" class="overlay"></div>
<nav th:replace="~{components/layout :: topbar}"></nav>
<aside th:replace="~{components/layout :: sidebar('productos')}"></aside>

<main id="content" class="content py-10">
    <div class="container-fluid">

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="fs-3 mb-1">Productos</h1>
                        <p class="mb-0">Gestion del catalogo e inventario</p>
                    </div>
                    <div>
                        <a th:href="@{/productos/nuevo}" class="btn btn-primary">Agregar Producto</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <table class="table mb-0 text-nowrap table-hover">
                    <thead class="table-light border-light">
                    <tr>
                        <th>Codigo</th>
                        <th>Nombre</th>
                        <th>Categoria</th>
                        <th>Precio Venta</th>
                        <th>Stock Actual</th>
                        <th>Accion</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="producto : ${productos}" class="align-middle">
                        <td th:text="${producto.codigo}">PRD001</td>
                        <td th:text="${producto.nombre}">Nombre</td>
                        <td th:text="${producto.categoria}">Categoria</td>
                        <td th:text="${'$' + producto.precioVenta}">$0</td>
                        <td>
                            <span th:text="${producto.stockActual}"
                                  th:classappend="${producto.bajoStockMinimo} ? 'text-danger fw-bold'">0</span>
                        </td>
                        <td>
                            <a th:href="@{/productos/{id}/editar(id=${producto.id})}"><i class="ti ti-edit"></i></a>
                            <form th:action="@{/productos/{id}/eliminar(id=${producto.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar este producto?');">
                                <button type="submit" class="btn btn-link link-danger p-0 ms-2">
                                    <i class="ti ti-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="6" class="text-center text-secondary py-4">No hay productos cargados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <footer th:replace="~{components/layout :: footer}"></footer>
            </div>
        </div>
    </div>
</main>
</body>
</html>
