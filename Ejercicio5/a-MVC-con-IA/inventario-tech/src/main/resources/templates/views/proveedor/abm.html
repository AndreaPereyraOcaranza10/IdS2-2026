<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: pageHead('Proveedores')}"></head>
<body>
<div id="overlay" class="overlay"></div>
<nav th:replace="~{components/layout :: topbar}"></nav>
<aside th:replace="~{components/layout :: sidebar('proveedores')}"></aside>

<main id="content" class="content py-10">
    <div class="container-fluid">

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="fs-3 mb-1">Proveedores</h1>
                        <p class="mb-0">Gestion de proveedores mayoristas</p>
                    </div>
                    <a th:href="@{/proveedores/nuevo}" class="btn btn-primary">Agregar Proveedor</a>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <table class="table mb-0 text-nowrap table-hover">
                    <thead class="table-light border-light">
                    <tr>
                        <th>Razon Social</th>
                        <th>CUIT</th>
                        <th>Telefono</th>
                        <th>Email</th>
                        <th>Estado</th>
                        <th>Accion</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="proveedor : ${proveedores}" class="align-middle">
                        <td>
                            <a th:href="@{/proveedores/{id}(id=${proveedor.id})}" th:text="${proveedor.razonSocial}">Razon Social</a>
                        </td>
                        <td th:text="${proveedor.cuit}">20-12345678-9</td>
                        <td th:text="${proveedor.telefono}">-</td>
                        <td th:text="${proveedor.email}">-</td>
                        <td>
                            <span class="badge" th:classappend="${proveedor.activo} ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'"
                                  th:text="${proveedor.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                        </td>
                        <td>
                            <a th:href="@{/proveedores/{id}/editar(id=${proveedor.id})}"><i class="ti ti-edit"></i></a>
                            <form th:action="@{/proveedores/{id}/eliminar(id=${proveedor.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar este proveedor?');">
                                <button type="submit" class="btn btn-link link-danger p-0 ms-2">
                                    <i class="ti ti-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(proveedores)}">
                        <td colspan="6" class="text-center text-secondary py-4">No hay proveedores cargados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <footer th:replace="~{components/layout :: footer}"></footer>
            </div>
        </div>
    </div>
</main>
</body>
</html>
