# =============================================================================
# application.properties - Configuración del Sistema de Gestión Escolar
# =============================================================================
# Spring Boot lee este archivo al arrancar. Los valores con la forma ${VARIABLE:valor}
# toman la variable de entorno VARIABLE y, si no existe, usan "valor" por defecto.
# =============================================================================

spring.application.name=sistema-escolar
server.port=8080

# ----------------------------- BASE DE DATOS (MySQL) --------------------------
# XAMPP: iniciar el módulo MySQL. "createDatabaseIfNotExist=true" crea la base "colegio" sola.
spring.datasource.url=jdbc:mysql://localhost:3306/colegio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Mendoza
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_CLAVE:}

# ----------------------------- JPA / HIBERNATE (ORM) --------------------------
# update = Hibernate crea/ajusta las tablas a partir de las entidades (útil en desarrollo).
spring.jpa.hibernate.ddl-auto=update
# false = las entidades JPA NO viajan a la vista: solo DTO (la sesión se cierra al terminar el servicio).
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------- CORREO (SMTP) ----------------------------------
# Para enviar correos reales definir MAIL_USUARIO y MAIL_CLAVE (ver README).
# Ejemplo Gmail: usar una "contraseña de aplicación" (no la contraseña normal de la cuenta).
# Si MAIL_USUARIO está vacío, el sistema funciona en MODO SIMULADO: registra el correo en la consola.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PUERTO:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_CLAVE:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ----------------------------- PROPIEDADES PROPIAS (colegio.*) ----------------
# Se leen en la clase config/PropiedadesColegio.
colegio.nombre=Colegio Horizonte
colegio.url-base=${URL_BASE:http://localhost:8080}
colegio.direccion=Av. San Martín 1234, Mendoza, Argentina
colegio.telefono=+54 261 555-0123
colegio.email-contacto=secretaria@colegiohorizonte.edu.ar

# Correo saliente
colegio.correo.habilitado=${CORREO_HABILITADO:true}
# Remitente (From). Si se deja vacío se usa spring.mail.username.
colegio.correo.remitente=${MAIL_REMITENTE:}

# Registro público de docentes:
#   false -> el docente puede ingresar apenas se registra (flujo pedido en el enunciado).
#   true  -> queda "pendiente" hasta que un ADMIN lo habilite desde el panel (más seguro en producción).
colegio.registro.requiere-aprobacion=false

# Usuario administrador inicial (se crea al primer arranque si no existe).
colegio.admin.email=admin@colegio.local
colegio.admin.password=Admin1234

# Datos de demostración (grados, aulas, materias, docentes, alumnos y notas). Poner false para arrancar vacío.
colegio.datos-demo.habilitado=true
colegio.datos-demo.password-docentes=Docente1234
