<!DOCTYPE html>
<!--
  FRAGMENTOS del panel privado (plantilla SB Admin, Bootstrap 5).
  Se reutilizan en todas las pantallas del panel: <head>, barra superior, menú lateral, pie y scripts.
  El fragmento del <head> se llama "encabezadoHtml" (NO "head") para no chocar con la etiqueta <head>.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Orden de CSS importante: primero el CSS de simple-datatables y DESPUÉS el tema (styles.css), y por último el propio -->
<head th:fragment="encabezadoHtml(titulo)">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${titulo} + ' | ' + ${colegio.nombre}">Panel</title>
    <link th:href="@{/recursos/vendor/simple-datatables/style.css}" rel="stylesheet">
    <link th:href="@{/recursos/admin/css/styles.css}" rel="stylesheet">
    <link th:href="@{/recursos/vendor/fontawesome/css/all.min.css}" rel="stylesheet">
    <link th:href="@{/recursos/admin/css/panel.css}" rel="stylesheet">
</head>

<body>

<!-- ===== Barra superior: marca, botón de menú y menú de usuario (cierre de sesión por POST + CSRF) ===== -->
<nav th:fragment="barraSuperior" class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
    <a class="navbar-brand ps-3" th:href="@{/panel}" th:text="${colegio.nombre}">Colegio</a>
    <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" type="button"
            aria-label="Mostrar u ocultar menú"><i class="fas fa-bars"></i></button>
    <ul class="navbar-nav ms-auto me-3 me-lg-4">
        <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" id="menuUsuario" href="#" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fas fa-user fa-fw"></i> <span class="d-none d-md-inline" sec:authentication="name">usuario</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="menuUsuario">
                <li><a class="dropdown-item" th:href="@{/panel/perfil}"><i class="fas fa-key fa-fw"></i> Mi perfil y contraseña</a></li>
                <li><a class="dropdown-item" th:href="@{/}"><i class="fas fa-globe fa-fw"></i> Sitio público</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item"><i class="fas fa-sign-out-alt fa-fw"></i> Cerrar sesión</button>
                    </form>
                </li>
            </ul>
        </li>
    </ul>
</nav>

<!-- ===== Menú lateral: los ítems de administración solo se dibujan para el rol ADMIN (sec:authorize) ===== -->
<div th:fragment="menuLateral" id="layoutSidenav_nav">
    <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
        <div class="sb-sidenav-menu">
            <div class="nav">
                <div class="sb-sidenav-menu-heading">Inicio</div>
                <a class="nav-link" th:classappend="${menuActivo == 'panel'} ? 'active'" th:href="@{/panel}">
                    <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>Tablero</a>

                <div class="sb-sidenav-menu-heading">Académico</div>
                <a class="nav-link" th:classappend="${menuActivo == 'alumnos'} ? 'active'" th:href="@{/panel/alumnos}">
                    <div class="sb-nav-link-icon"><i class="fas fa-user-graduate"></i></div>Alumnos</a>
                <a class="nav-link" th:classappend="${menuActivo == 'notas'} ? 'active'" th:href="@{/panel/notas}">
                    <div class="sb-nav-link-icon"><i class="fas fa-clipboard-check"></i></div>Notas</a>

                <div sec:authorize="hasRole('ADMIN')">
                    <div class="sb-sidenav-menu-heading">Administración</div>
                    <a class="nav-link" th:classappend="${menuActivo == 'docentes'} ? 'active'" th:href="@{/panel/docentes}">
                        <div class="sb-nav-link-icon"><i class="fas fa-chalkboard-teacher"></i></div>Docentes</a>
                    <a class="nav-link" th:classappend="${menuActivo == 'grados'} ? 'active'" th:href="@{/panel/grados}">
                        <div class="sb-nav-link-icon"><i class="fas fa-layer-group"></i></div>Grados</a>
                    <a class="nav-link" th:classappend="${menuActivo == 'aulas'} ? 'active'" th:href="@{/panel/aulas}">
                        <div class="sb-nav-link-icon"><i class="fas fa-door-open"></i></div>Aulas</a>
                    <a class="nav-link" th:classappend="${menuActivo == 'materias'} ? 'active'" th:href="@{/panel/materias}">
                        <div class="sb-nav-link-icon"><i class="fas fa-book"></i></div>Materias</a>
                </div>

                <div class="sb-sidenav-menu-heading">Cuenta</div>
                <a class="nav-link" th:classappend="${menuActivo == 'perfil'} ? 'active'" th:href="@{/panel/perfil}">
                    <div class="sb-nav-link-icon"><i class="fas fa-key"></i></div>Mi perfil</a>
            </div>
        </div>
        <div class="sb-sidenav-footer">
            <div class="small">Sesión iniciada como:</div>
            <span sec:authentication="name">usuario</span>
        </div>
    </nav>
</div>

<footer th:fragment="pie" class="py-4 bg-light mt-auto">
    <div class="container-fluid px-4">
        <div class="small text-muted">&copy; <span th:text="${anioActual}">2026</span>
            <span th:text="${colegio.nombre}">Colegio</span> - Sistema de gestión escolar</div>
    </div>
</footer>

<!-- Scripts al final del body: Bootstrap 5, script del tema (menú lateral), simple-datatables y su inicializador -->
<th:block th:fragment="scripts">
    <script th:src="@{/recursos/vendor/bootstrap5/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/recursos/admin/js/scripts.js}"></script>
    <script th:src="@{/recursos/vendor/simple-datatables/simple-datatables.js}"></script>
    <script th:src="@{/recursos/admin/js/tablas.js}"></script>
</th:block>

<!-- Avisos flash: "exito" y "error" se cargan con RedirectAttributes.addFlashAttribute en los controladores -->
<div th:fragment="mensajes">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${exito}">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button></div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button></div>
</div>

</body>
</html>
