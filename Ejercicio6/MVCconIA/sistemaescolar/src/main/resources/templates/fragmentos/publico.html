<!DOCTYPE html>
<!--
  FRAGMENTOS del sitio público (plantilla Oinia, Bootstrap 4).
  Un "fragmento" es un trozo de HTML reutilizable; las páginas lo incluyen con th:replace="~{archivo :: nombre}".
  IMPORTANTE: el fragmento del <head> NO se llama "head" (chocaría con la etiqueta <head>); se llama "encabezadoHtml".
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ===== <head> común: metadatos + CSS de la plantilla (locales; style.css importa solo Google Fonts) ===== -->
<head th:fragment="encabezadoHtml(titulo)">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | ' + ${colegio.nombre}">Colegio</title>
    <link rel="stylesheet" type="text/css" th:href="@{/recursos/publico/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/recursos/publico/css/style.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/recursos/publico/css/responsive.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/recursos/publico/css/colegio.css}">
</head>

<body>

<!-- ===== Barra de navegación (navbar de Oinia). El ítem activo se marca con la variable "menuActivo" del Model ===== -->
<nav th:fragment="barraNavegacion" class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="logo">
        <a class="logo-texto" th:href="@{/}"><span>&#9998;</span> <th:block th:text="${colegio.nombre}">Colegio</th:block></a>
    </div>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menuPrincipal"
            aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar menú">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item" th:classappend="${menuActivo == 'inicio'} ? 'active'">
                <a class="nav-link" th:href="@{/}">Inicio</a></li>
            <li class="nav-item" th:classappend="${menuActivo == 'grados'} ? 'active'">
                <a class="nav-link" th:href="@{/grados}">Grados</a></li>
            <li class="nav-item" th:classappend="${menuActivo == 'servicios'} ? 'active'">
                <a class="nav-link" th:href="@{/servicios}">Servicios</a></li>
            <li class="nav-item" th:classappend="${menuActivo == 'contacto'} ? 'active'">
                <a class="nav-link" th:href="@{/contacto}">Contacto</a></li>
        </ul>
        <div class="form-inline my-2 my-lg-0">
            <!-- sec:authorize: se evalúa contra Spring Security (thymeleaf-extras-springsecurity6) -->
            <div class="login_text" sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Ingresar</a></div>
            <div class="login_text" sec:authorize="isAuthenticated()"><a th:href="@{/panel}">Ir al panel</a></div>
        </div>
    </div>
</nav>

<!-- ===== Banner de páginas internas: título grande sobre el fondo de la plantilla ===== -->
<div th:fragment="bannerInterno(subtitulo, titulo)" class="banner_interna">
    <div class="container">
        <p class="banner_text" th:text="${subtitulo}">Subtítulo</p>
        <h1 class="banner_taital" th:text="${titulo}">Título</h1>
    </div>
</div>

<!-- ===== Pie de página (footer de Oinia adaptado: datos reales del colegio desde application.properties) ===== -->
<div th:fragment="pie">
    <div class="footer_section">
        <div class="container">
            <h1 class="touch_text">Contacto</h1>
            <div class="call_main">
                <div class="call_text"><img th:src="@{/recursos/publico/images/call-icon.png}" alt="Teléfono">
                    <span class="padding_left_15" th:text="${colegio.telefono}">Teléfono</span></div>
                <div class="call_text"><img th:src="@{/recursos/publico/images/mail-icon.png}" alt="Correo">
                    <span class="padding_left_15" th:text="${colegio.emailContacto}">correo</span></div>
            </div>
            <div class="social_icon">
                <ul>
                    <li><a href="#"><img th:src="@{/recursos/publico/images/fb-icon.png}" alt="Facebook"></a></li>
                    <li><a href="#"><img th:src="@{/recursos/publico/images/twitter-icon.png}" alt="Twitter"></a></li>
                    <li><a href="#"><img th:src="@{/recursos/publico/images/linkedin-icon.png}" alt="LinkedIn"></a></li>
                    <li><a href="#"><img th:src="@{/recursos/publico/images/instagram-icon.png}" alt="Instagram"></a></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="copyright_section">
        <div class="container">
            <p class="copyright_text">&copy; <span th:text="${anioActual}">2026</span>
                <span th:text="${colegio.nombre}">Colegio</span> - Sistema de gestión escolar</p>
        </div>
    </div>
</div>

<!-- ===== Scripts: jQuery + Bootstrap 4 bundle (locales). Van al final del body para no bloquear el render ===== -->
<th:block th:fragment="scripts">
    <script th:src="@{/recursos/publico/js/jquery.min.js}"></script>
    <script th:src="@{/recursos/publico/js/bootstrap.bundle.min.js}"></script>
</th:block>

<!-- ===== Avisos flash (éxito / error) reutilizables ===== -->
<div th:fragment="mensajes">
    <div class="alert alert-success" role="alert" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
</div>

</body>
</html>
