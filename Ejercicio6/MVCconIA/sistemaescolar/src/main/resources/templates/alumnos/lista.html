<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/panel :: encabezadoHtml('Alumnos')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{fragmentos/panel :: barraSuperior}"></nav>
<div id="layoutSidenav">
    <div th:replace="~{fragmentos/panel :: menuLateral}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <!-- Lista de alumnos. El DOCENTE solo recibe (desde el servicio) los de sus grados; los botones de escritura solo se dibujan para ADMIN. -->
                <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
                    <h1 class="mb-0">Alumnos</h1>
                    <a class="btn btn-primary" sec:authorize="hasRole('ADMIN')" th:href="@{/panel/alumnos/nuevo}"><i class="fas fa-plus me-1"></i>Nuevo alumno</a>
                </div>
                <div th:replace="~{fragmentos/panel :: mensajes}"></div>
                <div class="card mb-4">
                    <div class="card-header"><i class="fas fa-table me-1"></i>Listado</div>
                    <div class="card-body">
                        <table class="tabla-datos">
                            <thead><tr><th>DNI</th><th>Apellido y nombre</th><th>Grado</th><th>Aula</th><th>Edad</th><th class="no-imprimir">Acciones</th></tr></thead>
                            <tbody>
                            <tr th:each="a : ${alumnos}">
                                <td th:text="${a.dni}">12345678</td>
                                <td th:text="${a.nombreCompleto}">Pérez, Ana</td>
                                <td th:text="${a.gradoNombre}">1.º Grado</td>
                                <td th:text="${a.aulaCodigo}">A-101</td>
                                <td th:text="${a.edad}">7</td>
                                <td class="acciones-tabla">
                                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/panel/alumnos/{id}(id=${a.id})}"><i class="fas fa-eye"></i> Ver</a>
                                    <a class="btn btn-sm btn-outline-success" th:href="@{/panel/notas/boletin/{id}(id=${a.id})}"><i class="fas fa-file-alt"></i> Boletín</a>
                                    <span sec:authorize="hasRole('ADMIN')">
                                        <a class="btn btn-sm btn-outline-primary" th:href="@{/panel/alumnos/{id}/editar(id=${a.id})}"><i class="fas fa-edit"></i> Editar</a>
                                        <form th:action="@{/panel/alumnos/{id}/eliminar(id=${a.id})}" method="post"
                                              onsubmit="return confirm('¿Eliminar este alumno y sus notas?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i> Eliminar</button>
                                        </form>
                                    </span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragmentos/panel :: pie}"></footer>
    </div>
</div>
<th:block th:replace="~{fragmentos/panel :: scripts}"></th:block>
</body>
</html>
