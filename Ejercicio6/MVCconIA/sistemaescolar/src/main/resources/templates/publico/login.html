<!DOCTYPE html>
<!--
  Formulario de ingreso. El "th:action" genera la URL /login Y agrega automáticamente el token CSRF oculto.
  Los nombres de los campos (email, password) deben coincidir con usernameParameter/passwordParameter de ConfiguracionSeguridad.
  Spring Security procesa el POST; si las credenciales fallan redirige a /login?error, y tras salir a /login?logout.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/publico :: encabezadoHtml('Ingresar')}"></head>
<body>
<div class="header_section">
    <div class="container-fluid"><nav th:replace="~{fragmentos/publico :: barraNavegacion}"></nav></div>
    <div th:replace="~{fragmentos/publico :: bannerInterno('Acceso para docentes y administración', 'Ingresar')}"></div>
</div>

<div class="seccion_contenido layout_padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="tarjeta_formulario">
                    <h3>Iniciar sesión</h3>

                    <div th:replace="~{fragmentos/publico :: mensajes}"></div>
                    <div class="alert alert-danger" th:if="${param.error}">
                        Correo o contraseña incorrectos, o la cuenta no está habilitada.</div>
                    <div class="alert alert-info" th:if="${param.logout}">Cerraste sesión correctamente.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-group">
                            <label for="email">Correo personal (usuario)</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   autocomplete="username" required autofocus>
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-colegio btn-block">Ingresar</button>
                    </form>
                    <p class="mt-3 mb-0">¿Sos docente y no tenés cuenta? <a th:href="@{/registro}">Registrate</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragmentos/publico :: pie}"></div>
<th:block th:replace="~{fragmentos/publico :: scripts}"></th:block>
</body>
</html>
