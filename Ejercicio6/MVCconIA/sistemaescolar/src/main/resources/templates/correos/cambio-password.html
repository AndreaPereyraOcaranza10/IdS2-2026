<!DOCTYPE html>
<!-- Aviso de seguridad: la contraseña fue modificada. -->
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, Helvetica, sans-serif; color:#333; background:#f4f4f4; padding:20px;">
<div style="max-width:560px; margin:0 auto; background:#fff; border-radius:8px; padding:30px;">
    <h2 style="color:#b39f16; margin-top:0;">Tu contraseña fue modificada</h2>
    <p>Hola <span th:text="${nombre}">Docente</span>, te avisamos que la contraseña de tu cuenta en
        <strong th:text="${colegio}">Colegio</strong> se cambió recién.</p>
    <p>Si fuiste vos, no tenés que hacer nada. Si no reconocés este cambio, comunicate de inmediato con
        <strong th:text="${contacto}">administración</strong>.</p>
    <p style="font-size:12px; color:#888;">&copy; <span th:text="${anio}">2026</span> <span th:text="${colegio}">Colegio</span></p>
</div>
</body>
</html>
