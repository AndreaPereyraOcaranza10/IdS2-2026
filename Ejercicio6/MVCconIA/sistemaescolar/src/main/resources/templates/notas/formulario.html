<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/panel :: encabezadoHtml('Nota')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{fragmentos/panel :: barraSuperior}"></nav>
<div id="layoutSidenav">
    <div th:replace="~{fragmentos/panel :: menuLateral}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <!-- Alta/edición de nota. Los desplegables llegan ya filtrados por permisos desde ServicioNota. -->
                <h1 class="mt-4" th:text="${edicion} ? 'Editar nota' : 'Nueva nota'">Nueva nota</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/panel/notas}">Notas</a></li>
                    <li class="breadcrumb-item active" th:text="${edicion} ? 'Editar' : 'Nueva'">Nueva</li>
                </ol>
                <div class="alert alert-info" th:if="${alumnos.isEmpty() or materias.isEmpty()}">
                    No tenés alumnos o materias habilitados para calificar. Administración debe asignarte grados y materias.</div>
                <div class="card mb-4">
                    <div class="card-body">
                        <form th:action="${edicion} ? @{/panel/notas/{id}(id=${nota.id})} : @{/panel/notas}"
                              th:object="${nota}" method="post" novalidate>
                            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                                <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div></div>
                            <div class="row">
                                <div class="col-md-6 mb-3"><label class="form-label" for="alumnoId">Alumno</label>
                                    <select class="form-select" th:field="*{alumnoId}">
                                        <option value="">Seleccione...</option>
                                        <option th:each="a : ${alumnos}" th:value="${a.id}"
                                                th:text="${a.nombreCompleto} + ' - ' + ${a.gradoNombre}">Pérez, Ana</option>
                                    </select>
                                    <span class="campo-error" th:if="${#fields.hasErrors('alumnoId')}" th:errors="*{alumnoId}"></span></div>
                                <div class="col-md-6 mb-3"><label class="form-label" for="materiaId">Materia</label>
                                    <select class="form-select" th:field="*{materiaId}">
                                        <option value="">Seleccione...</option>
                                        <option th:each="m : ${materias}" th:value="${m.id}" th:text="${m.nombre}">Matemática</option>
                                    </select>
                                    <span class="campo-error" th:if="${#fields.hasErrors('materiaId')}" th:errors="*{materiaId}"></span></div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3"><label class="form-label" for="periodo">Período</label>
                                    <select class="form-select" th:field="*{periodo}">
                                        <option value="">Seleccione...</option>
                                        <option th:each="p : ${periodos}" th:value="${p}" th:text="${p.etiqueta}">1.º trimestre</option>
                                    </select>
                                    <span class="campo-error" th:if="${#fields.hasErrors('periodo')}" th:errors="*{periodo}"></span></div>
                                <div class="col-md-4 mb-3"><label class="form-label" for="valor">Nota (1 a 10)</label>
                                    <input type="number" class="form-control" th:field="*{valor}" step="0.01" min="1" max="10">
                                    <span class="campo-error" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></span></div>
                                <div class="col-md-4 mb-3"><label class="form-label" for="fecha">Fecha</label>
                                    <input type="date" class="form-control" th:field="*{fecha}">
                                    <span class="campo-error" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></span></div>
                            </div>
                            <div class="mb-3"><label class="form-label" for="observaciones">Observaciones</label>
                                <textarea class="form-control" rows="2" th:field="*{observaciones}" maxlength="255"></textarea>
                                <span class="campo-error" th:if="${#fields.hasErrors('observaciones')}" th:errors="*{observaciones}"></span></div>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Guardar</button>
                            <a class="btn btn-secondary" th:href="@{/panel/notas}">Cancelar</a>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragmentos/panel :: pie}"></footer>
    </div>
</div>
<th:block th:replace="~{fragmentos/panel :: scripts}"></th:block>
</body>
</html>
